<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Checker</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ok:#16a34a;--no:#dc2626;--ac:#4f46e5;--bd:#e5e7eb}
  @media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f2b;--tx:#e8ebf2;--mut:#9aa3b2;--bd:#2a3140}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  h1{font-size:1.2rem;margin:4px 0 12px}
  .sbox{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
  input{width:100%;padding:14px 16px;font-size:1.1rem;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);outline:none}
  input:focus{border-color:var(--ac)}
  .status{margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:.95rem}
  .st-ok{background:#16a34a22;color:var(--ok)}
  .st-no{background:#dc262622;color:var(--no)}
  .st-sim{background:#d9770622;color:#d97706}
  .st-idle{background:var(--card);color:var(--mut);font-weight:400}
  .item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .item .w{font-weight:600}
  .sn{display:inline-block;min-width:2.2em;color:var(--mut);font-size:.8rem}
  .pr{color:var(--mut);font-size:.85rem}
  .item .m{color:var(--mut);text-align:right}
  .item.exact{border-color:var(--ok);border-width:2px}
  .tag{font-size:.7rem;padding:2px 7px;border-radius:99px;margin-left:8px;background:var(--bd);color:var(--mut);font-weight:500}
  mark{background:#fde04777;color:inherit;border-radius:3px}
  .add{margin-top:12px;display:none;gap:8px}
  .add input{font-size:1rem;padding:10px 12px}
  button{padding:10px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:.95rem;cursor:pointer}
  .foot{margin-top:18px;color:var(--mut);font-size:.8rem;text-align:center}
  .item>div:first-child{min-width:0;overflow-wrap:anywhere}
  .item .m{flex-shrink:0;max-width:45%}
  .add input{flex:1;min-width:0}
  .wrap{padding-bottom:40px}
  @media (max-width:420px){
    .wrap{padding:12px}
    h1{font-size:1.05rem}
    .item{padding:9px 10px;gap:8px}
    .tag{display:block;margin:3px 0 0;width:fit-content}
    .item .m{font-size:.9rem}
  }
  .pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
  .pgbtn{width:56px;height:44px;font-size:1.6rem;line-height:1;padding:0}
  .pgbtn:disabled{opacity:.35;cursor:default}
  .pgnum{font-weight:600;font-size:1rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 English Words – Class 5 <span id="count" style="color:var(--mut);font-weight:400;font-size:.85rem"></span></h1>
  <div class="sbox">
    <input id="q" type="search" placeholder="Word type করো (English বা বাংলা)..." autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <div id="status" class="status" style="display:none"></div>
    <div id="pager" class="pager"><button id="prev" class="pgbtn" aria-label="Previous page">&#8249;</button><span id="pg" class="pgnum"></span><button id="next" class="pgbtn" aria-label="Next page">&#8250;</button></div>
  </div>
  <div id="add" class="add">
    <input id="newMeaning" placeholder="বাংলা মানে (optional)">
    <button id="addBtn">Add</button>
  </div>
  <div id="results"></div>
</div>

const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
let words = BASE.split("\n").map(l=>{const [w,m,p,u]=l.split("|");return {w:cap(w),m,p:"Page "+p,u}});
try{ const extra = JSON.parse(localStorage.getItem("extraWords")||"[]").map(x=>({...x,w:cap(x.w),p:words[words.length-1].p})); words = words.concat(extra); }catch(e){}
words.forEach((x,i)=>x.n=i+1);

const $ = id => document.getElementById(id);
let page=1;
const order=()=>[...new Set(words.map(x=>x.p))];
const pages=()=>order().length;
const norm = s => s.toLowerCase().trim().replace(/\s+/g," ");
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){
    let prev=d[0]; d[0]=i;
    for(let j=1;j<=b.length;j++){
      const t=d[j];
      d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
      prev=t;
    }
  }
  return d[b.length];
}

function hl(text,q){
  const i=norm(text).indexOf(q);
  if(i<0||!q) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}

function search(){
  const raw=$("q").value, q=norm(raw);
  const res=$("results"), st=$("status"), add=$("add");
  add.style.display="none";
  $("pager").style.display=q?"none":"flex";
  if(!q){
    page=Math.min(page,pages());
    $("pg").textContent="Page "+page+" / "+pages();
    $("prev").disabled=page<=1; $("next").disabled=page>=pages();
    st.style.display="none";
    res.innerHTML=words.filter(x=>x.p===order()[page-1]).map(x=>
      `<div class="item"><div><span class="sn">${x.n}.</span><span class="w">${esc(x.w)}</span>${x.u?` <span class="pr">(${esc(x.u)})</span>`:""}</div><div class="m">${esc(x.m||"")}<br><small>${x.p}</small></div></div>`
    ).join("");
    return;
  }
  st.style.display="";

  const scored=[];
  words.forEach(x=>{
    const w=norm(x.w), m=x.m||"";
    let s=0,tag="";
    if(w===q){s=100;tag="exact"}
    else if(m.split(/[\/,]/).some(p=>p.trim()===raw.trim())){s=90;tag="meaning"}
    else if(w.startsWith(q)){s=80;tag="starts with"}
    else if(w.includes(q)){s=60;tag="contains"}
    else if(m.includes(raw.trim())){s=55;tag="meaning"}
    else if(q.length>=3 && w.length>=3){
      const d=lev(q,w), lim=q.length>=6?2:1;
      if(d<=lim){s=40-d*5;tag="similar"}
      else if(q.length>=4 && w.length>=4 && (w.startsWith(q.slice(0,-1))||q.startsWith(w.slice(0,-1)))){s=30;tag="similar"}
    }
    if(s) scored.push({...x,s,tag});
  });
  scored.sort((a,b)=>b.s-a.s||a.w.localeCompare(b.w));

  const exact=scored.find(x=>x.tag==="exact");
  if(exact){
    st.className="status st-ok";
    st.textContent="✅ Already added আছে ("+exact.p+")";
  } else if(scored.length){
    st.className="status st-sim";
    st.textContent="⚠️ Exact নেই, কিন্তু "+scored.length+"টা similar পাওয়া গেছে";
  } else {
    st.className="status st-no";
    st.textContent="❌ নেই — নতুন add করতে পারো";
  }
  if(!exact && /^[a-z' -]+$/i.test(raw.trim())) add.style.display="flex";

  res.innerHTML=scored.slice(0,40).map(x=>
    `<div class="item ${x.tag==="exact"?"exact":""}"><div><span class="sn">${x.n}.</span><span class="w">${hl(x.w,q)}</span>${x.u?` <span class="pr">(${esc(x.u)})</span>`:""}<span class="tag">${x.tag}</span></div><div class="m">${esc(x.m||"")}<br><small>${x.p}</small></div></div>`
  ).join("");
}

$("addBtn").onclick=()=>{
  const w=$("q").value.trim(); if(!w) return;
  const item={w:cap(w),m:$("newMeaning").value.trim(),p:words[words.length-1].p};
  item.n=words.length+1;
  words.push(item);
  try{
    const extra=JSON.parse(localStorage.getItem("extraWords")||"[]"); extra.push(item);
    localStorage.setItem("extraWords",JSON.stringify(extra));
  }catch(e){}
  $("newMeaning").value=""; $("count").textContent="("+words.length+" words)"; search();
};

$("prev").onclick=()=>{if(page>1){page--;search();window.scrollTo(0,0)}};
$("next").onclick=()=>{if(page<pages()){page++;search();window.scrollTo(0,0)}};
$("q").addEventListener("input",search);
$("count").textContent="("+words.length+" words)";
search();
</script>
</body>
</html>
